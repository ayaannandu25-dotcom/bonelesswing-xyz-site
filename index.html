
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My XYZ Website</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b1020;
      color: white;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 8%;
      background: #151c32;
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
      color: #8b9cff;
    }

    nav a {
      margin-left: 20px;
      color: white;
      text-decoration: none;
    }

    .hero {
      text-align: center;
      padding: 70px 20px;
      background: linear-gradient(135deg, #182447, #352060);
    }

    h1 { font-size: 42px; }

    .hero p { color: #c7cbe0; }

    input {
      padding: 15px;
      width: 80%;
      max-width: 430px;
      border-radius: 10px;
      border: none;
      margin-top: 20px;
      font-size: 16px;
    }

    main {
      max-width: 1100px;
      margin: auto;
      padding: 35px 20px;
    }

    .games {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .card {
      background: #1b2540;
      padding: 25px;
      border-radius: 15px;
      text-align: center;
      transition: transform .2s;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    .card h2 { margin-bottom: 12px; }

    button {
      background: #667bff;
      color: white;
      border: none;
      padding: 12px 22px;
      border-radius: 8px;
      cursor: pointer;
    }

    button:hover { background: #8795ff; }

    footer {
      text-align: center;
      padding: 25px;
      color: #929bb5;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">MY XYZ</div>
    <nav>
      <a href="#home">Home</a>
      <a href="#games">Games</a>
    </nav>
  </header>

  <section class="hero" id="home">
    <h1>Welcome to My Website</h1>
    <p>Choose something to explore!</p>
    <input
      id="search"
      type="search"
      placeholder="Search games..."
      oninput="searchGames()"
    >
  </section>

  <main id="games">
    <h2>Games</h2>

    <div class="games">
      <div class="card" data-name="clicker">
        <h2>Clicker</h2>
        <p>A simple clicker game</p>
        <button onclick="playClicker()">Play</button>
      </div>

      <div class="card" data-name="snake">
        <h2>Snake</h2>
        <p>Classic snake game</p>
        <button onclick="openGame('snake.html')">Play</button>
      </div>

      <div class="card" data-name="platformer">
        <h2>Platformer</h2>
        <p>Jump and avoid obstacles</p>
        <button onclick="openGame('platformer.html')">Play</button>
      </div>
    </div>
  </main>

  <footer>My XYZ Website © 2026</footer>

  <script>
    function searchGames() {
      const search = document.getElementById("search")
        .value.toLowerCase();

      document.querySelectorAll(".card").forEach(card => {
        card.style.display =
          card.dataset.name.includes(search) ? "" : "none";
      });
    }

    function openGame(file) {
      window.location.href = file;
    }

    let clicks = 0;

    function playClicker() {
      clicks++;
      alert("Total clicks: " + clicks);
    }
  </script>

</body>
</html>
